<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        AI Banking Assistant
    </h1>

    <div class="card p-4 shadow">

        <form method="POST">

            <div class="mb-3">

                <input
                    type="text"
                    class="form-control"
                    name="question"
                    placeholder="Ask a banking question..."
                    required
                >

            </div>

            <button
                class="btn btn-primary"
                type="submit"
            >
                Ask AI
            </button>

        </form>

    </div>

    <div class="mt-4">

        {% for chat in history %}

        <div class="card p-3 mb-3 shadow-sm">

            <h5>User</h5>
            <p>{{ chat.question }}</p>

            <h5>AI Banking Tutor</h5>
            <p>{{ chat.answer }}</p>

        </div>

        {% endfor %}

    </div>

</div>

</body>
