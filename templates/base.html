<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BankPrepAI{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="app-header py-4">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <div class="fs-2" aria-hidden="true">🏦</div>
                <div>
                    <h1 class="h3 mb-1">BankPrepAi</h1>
                    <p class="mb-0">Ask questions, track exams and check your eligibility.</p>
                </div>
            </div>
            <nav class="nav mt-3 gap-4" aria-label="Main">
                <a class="nav-link text-white px-0 py-1 {% if active == 'ask' %}border-bottom border-2 border-light{% endif %}"
                   href="{{ url_for('home') }}">Ask</a>
                <a class="nav-link text-white px-0 py-1 {% if active == 'exams' %}border-bottom border-2 border-light{% endif %}"
                   href="{{ url_for('exams') }}">Exams</a>
                <a class="nav-link text-white px-0 py-1 {% if active == 'eligibility' %}border-bottom border-2 border-light{% endif %}"
                   href="{{ url_for('eligibility') }}">Eligibility</a>
            </nav>
        </div>
    </header>

    <main class="container py-4 py-md-5" style="max-width: 850px;">
        {% block content %}{% endblock %}

        <p class="small text-center mt-4 mb-0">
            For learning purposes. Always confirm dates and eligibility in the official notification.
        </p>
    </main>
</body>
</html>
